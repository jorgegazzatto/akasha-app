version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akasha_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://akasha_user:akasha_secure_pass@db:5432/akasha_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    expose:
      - "8000"
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/audio_cache:/app/audio_cache
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.akasha-backend-web.rule=Host(`apiakh.elohdigital.com.br`)"
      - "traefik.http.routers.akasha-backend-web.entrypoints=web"
      - "traefik.http.routers.akasha-backend-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.akasha-backend-websecure.rule=Host(`apiakh.elohdigital.com.br`)"
      - "traefik.http.routers.akasha-backend-websecure.entrypoints=websecure"
      - "traefik.http.routers.akasha-backend-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.akasha-backend-websecure.loadbalancer.server.port=8000"

  # Worker Assíncrono para Geração de Áudios (Celery)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akasha_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://akasha_user:akasha_secure_pass@db:5432/akasha_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    depends_on:
      - redis
      - db
    volumes:
      - ./backend/audio_cache:/app/audio_cache
    networks:
      - default

  # Banco de Dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: akasha_postgres
    restart: always
    environment:
      - POSTGRES_USER=akasha_user
      - POSTGRES_PASSWORD=akasha_secure_pass
      - POSTGRES_DB=akasha_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  # Redis para Fila de Tarefas
  redis:
    image: redis:7-alpine
    container_name: akasha_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
  default:
